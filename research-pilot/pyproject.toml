[project]
name = "research-pilot"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "httpx[socks]>=0.28.1",
    "pydantic>=2.14.1",
    "python-dotenv>=1.2.4",
    "socksio>=1.0.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "respx>=0.23.1",
]

[tool.uv]
package = true

[tool.uv.workspace]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
exclude = ["other*"]
